name: Build Docker on Code Changes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r dev/requirements.txt

      - name: Lint with ruff
        working-directory: src
        run: ruff check .

      - name: Check formatting with ruff
        working-directory: src
        run: ruff format --check .

      - name: Create test hosts.json file
        run: |
          cp src/test/fixtures/hosts.json ${{ github.workspace }}/hosts.json

      - name: Run tests with coverage
        working-directory: src
        env:
          HOSTS_APP_PATH: ${{ github.workspace }}/hosts.json
        run: |
          export PYTHONPATH=${{ github.workspace }}/src:$PYTHONPATH
          python -m pytest test/ -v --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src/coverage.xml
          fail_ci_if_error: false
          verbose: true

  audit:
    runs-on: ubuntu-latest
    # Informative for now: findings show on the run without blocking the PR.
    # Once it has stayed clean for a while, remove continue-on-error so it
    # becomes a gate. For an unfixable finding use --ignore-vuln with a
    # comment explaining why, never disable the job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --require-hashes --disable-pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: site

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: echo "value=$(git describe --tags --always --abbrev=5)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cibrandocampo/ovh-dyndns-client
          tags: |
            type=raw,value=latest
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=ref,event=tag
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
      
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: cibrandocampo/ovh-dyndns-client
          readme-filepath: ./README.md
      
      - name: Build summary
        run: |
          echo "Docker image built successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
